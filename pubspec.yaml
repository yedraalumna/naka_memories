  shared_preferences: ^2.2.0
  path_provider: ^2.1.1
  
  uuid: ^4.3.1

  supabase_flutter: ^2.1.3
  provider: ^6.1.1
  cupertino_icons: ^1.0.6

  #para la funciones del pdf
  pdf: ^3.11.3
  printing: ^5.10.0
  http: ^1.1.0 

  #para la geolocalizacion
  geolocator: ^10.1.0

