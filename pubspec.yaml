name: nayeka_memories
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.2.6
  google_maps_flutter_web: ^0.5.0
  universal_io: ^2.3.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  url_launcher: ^6.2.1
  image_picker: ^1.0.4
  video_player: ^2.8.1
  chewie: ^1.7.1
  video_thumbnail: ^0.5.3
  shared_preferences: ^2.2.0
  path_provider: ^2.1.5
  uuid: ^4.3.1
  supabase_flutter: ^2.1.3
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  pdf: ^3.11.3
  printing: ^5.10.0
  http: ^1.6.0
  geolocator: ^10.1.0
  percent_indicator: ^4.0.0
  app_links: ^6.4.1
  share_plus: ^12.0.1
  pin_code_fields: ^8.0.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Añade esto para cambiar el icono de la app
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# Configuración para cambiar el icono de la app
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/logo.png"
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#6A1B9A"
    theme_color: "#6A1B9A"