name: mi_prueba
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.2.6
  google_maps_flutter_web: ^0.5.0

  universal_io: ^2.3.1

  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  url_launcher: ^6.2.1

  image_picker: ^1.0.4
  video_player: ^2.8.1
  chewie: ^1.7.1
